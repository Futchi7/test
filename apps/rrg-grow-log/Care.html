<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root {
      --green: #3F6F55; --green-dark: #2E5340; --leaf: #E6EFE8; --bg: #F4F6F2;
      --card: #FFFFFF; --text: #1F2A22; --muted: #5F6B63; --line: #DDE3DC; --accent: #D9822B;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif;
      line-height: 1.7; -webkit-text-size-adjust: 100%; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 40px; }
    header { display: flex; align-items: center; gap: 8px; padding: 14px 0; color: var(--green); font-weight: 700; letter-spacing: .02em; }
    header svg { width: 22px; height: 22px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-top: 14px; }
    .hero { display: flex; gap: 16px; align-items: center; }
    .photo { width: 104px; height: 104px; flex: 0 0 104px; border-radius: 14px; object-fit: cover; background: var(--leaf); }
    .photo.empty { display: flex; align-items: center; justify-content: center; font-size: 40px; }
    h1 { font-size: 22px; margin: 0; line-height: 1.3; }
    .code { color: var(--green); font-family: ui-monospace, Menlo, monospace; font-size: 14px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .chip { font-size: 12px; padding: 2px 10px; border-radius: 999px; background: var(--leaf); color: var(--green-dark); }
    .days { margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: var(--leaf); font-size: 14px; }
    .days b { font-size: 20px; color: var(--green-dark); }
    h2 { font-size: 16px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
    .guide dt { font-weight: 700; font-size: 14px; color: var(--green-dark); margin-top: 10px; }
    .guide dt:first-child { margin-top: 0; }
    .guide dd { margin: 2px 0 0; font-size: 14px; }
    .tip { margin-top: 12px; padding: 10px 12px; border-left: 4px solid var(--accent); background: #FBF3EA; font-size: 14px; border-radius: 0 8px 8px 0; }
    .timeline { list-style: none; margin: 0; padding: 0; }
    .timeline li { display: grid; grid-template-columns: 28px 1fr; gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
    .timeline li:first-child { border-top: 0; padding-top: 0; }
    .timeline .ico { font-size: 18px; line-height: 1.4; }
    .timeline .when { color: var(--muted); font-size: 12px; }
    .empty-note { color: var(--muted); font-size: 14px; margin: 0; }
    form label.q { display: block; font-weight: 700; font-size: 14px; margin: 14px 0 6px; }
    form label.q:first-of-type { margin-top: 0; }
    .scale, .choices { display: flex; flex-wrap: wrap; gap: 8px; }
    .scale input, .choices input { position: absolute; opacity: 0; pointer-events: none; }
    .scale span, .choices span { display: inline-block; min-width: 44px; padding: 8px 12px; text-align: center; border: 1px solid var(--line);
      border-radius: 10px; background: #fff; font-size: 14px; cursor: pointer; }
    .scale input:checked + span, .choices input:checked + span { background: var(--green); border-color: var(--green); color: #fff; }
    .scale input:focus-visible + span, .choices input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
    input[type=text], textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font: inherit; font-size: 16px; background: #fff; }
    textarea { min-height: 88px; resize: vertical; }
    .hint { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
    button { margin-top: 16px; width: 100%; padding: 12px; border: 0; border-radius: 12px; background: var(--green); color: #fff; font: inherit; font-weight: 700; font-size: 16px; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .msg { margin-top: 12px; font-size: 14px; }
    .msg.ok { color: var(--green-dark); } .msg.err { color: #B3261E; }
    footer { margin-top: 24px; color: var(--muted); font-size: 12px; text-align: center; }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 21V11"/><path d="M12 11c0-4 3-7 8-7 0 5-3 8-8 7Z"/><path d="M12 13C12 9.5 9.5 7 5 7c0 4 2.5 6.5 7 6Z"/></svg>
    <?= app.name ?>
  </header>

  <section class="card">
    <div class="hero">
      <? if (data.photo) { ?>
        <? /* photo は photoSrc_ で data:image/… か、引用符や &lt;&gt; を含まない https URL に限定済み */ ?>
        <img class="photo" src="<?!= data.photo ?>" alt="<?= data.name ?>の写真">
      <? } else { ?>
        <div class="photo empty" aria-hidden="true">🌿</div>
      <? } ?>
      <div>
        <h1><?= data.name ?></h1>
        <div class="code"><?= data.code ?></div>
        <div class="chips">
          <? if (data.variety) { ?><span class="chip"><?= data.variety ?></span><? } ?>
          <? if (data.potSize) { ?><span class="chip"><?= data.potSize ?></span><? } ?>
          <? if (data.stage) { ?><span class="chip"><?= data.stage ?></span><? } ?>
        </div>
      </div>
    </div>
    <? if (data.days !== null) { ?>
      <div class="days">RRGで育てて <b><?= data.days ?></b> 日目の株です（<?= data.registered ?> から育成）</div>
    <? } ?>
  </section>

  <? if (data.guide) { ?>
  <section class="card">
    <h2>🪴 育て方のポイント</h2>
    <dl class="guide">
      <? if (data.guide.place) { ?><dt>置き場所</dt><dd><?= data.guide.place ?></dd><? } ?>
      <? if (data.guide.water) { ?><dt>水やり</dt><dd><?= data.guide.water ?></dd><? } ?>
      <? if (data.guide.fertilizer) { ?><dt>肥料</dt><dd><?= data.guide.fertilizer ?></dd><? } ?>
      <? if (data.guide.winter) { ?><dt>冬越し</dt><dd><?= data.guide.winter ?></dd><? } ?>
    </dl>
    <? if (data.guide.tip) { ?><div class="tip"><?= data.guide.tip ?></div><? } ?>
  </section>
  <? } ?>

  <section class="card">
    <h2>📖 この株の育成記録</h2>
    <? if (data.logs.length) { ?>
      <ul class="timeline">
        <? var icons = {'水やり':'💧','水換え':'🔄','肥料':'🧪','植え替え':'🪴','剪定':'✂️','写真':'📷','出荷':'📦'}; ?>
        <? for (var i = 0; i < data.logs.length; i++) { var l = data.logs[i]; ?>
          <li>
            <span class="ico" aria-hidden="true"><?= icons[l.type] || '📝' ?></span>
            <div>
              <div class="when"><?= l.date ?></div>
              <div><strong><?= l.type ?></strong><? if (l.memo) { ?> ― <?= l.memo ?><? } ?></div>
            </div>
          </li>
        <? } ?>
      </ul>
    <? } else { ?>
      <p class="empty-note">記録はこれから追加されます。</p>
    <? } ?>
  </section>

  <section class="card">
    <h2>🙏 テスターアンケート（1分）</h2>
    <form id="fb" novalidate>
      <label class="q" id="q-rating">このページは役に立ちましたか？</label>
      <div class="scale" role="radiogroup" aria-labelledby="q-rating">
        <? for (var n = 1; n <= 5; n++) { ?>
          <label><input type="radio" name="rating" value="<?= n ?>"><span><?= n ?></span></label>
        <? } ?>
      </div>
      <p class="hint">1 = 役に立たなかった ／ 5 = とても役に立った</p>

      <label class="q" id="q-pay">水やりの通知や成長記録が使える「育成アプリ」があれば、月額100〜300円でも使いたいですか？</label>
      <div class="choices" role="radiogroup" aria-labelledby="q-pay">
        <? for (var k = 0; k < data.payOptions.length; k++) { ?>
          <label><input type="radio" name="pay" value="<?= data.payOptions[k] ?>"><span><?= data.payOptions[k] ?></span></label>
        <? } ?>
      </div>

      <label class="q" for="wish">あったらうれしい機能</label>
      <input type="text" id="wish" name="wish" maxlength="500" placeholder="例：水やりの日を通知してほしい">

      <label class="q" for="comment">ご意見・ご感想</label>
      <textarea id="comment" name="comment" maxlength="500"></textarea>
      <p class="hint">お名前やご住所などの個人情報は書かないでください。</p>

      <button type="submit" id="send">送信する</button>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
    </form>
  </section>

  <footer>
    <?= app.company ?><br>
    このページでは個人情報を収集していません。アンケートの回答はアプリの改善にのみ使います。
  </footer>
</div>

<script>
  (function () {
    var TOKEN = <?!= JSON.stringify(data.token) ?>;
    var form = document.getElementById('fb');
    var btn = document.getElementById('send');
    var msg = document.getElementById('msg');
    function show(text, ok) { msg.textContent = text; msg.className = 'msg ' + (ok ? 'ok' : 'err'); }
    function val(name) { var el = form.querySelector('input[name="' + name + '"]:checked'); return el ? el.value : ''; }
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var payload = { rating: val('rating'), pay: val('pay'), wish: form.wish.value, comment: form.comment.value };
      if (!payload.rating) { show('「役に立ちましたか？」を1〜5で選んでください。', false); return; }
      btn.disabled = true; show('送信しています…', true);
      google.script.run
        .withSuccessHandler(function (res) {
          show(res.message, res.ok);
          if (res.ok) { form.reset(); btn.textContent = '送信しました'; } else { btn.disabled = false; }
        })
        .withFailureHandler(function () { show('送信できませんでした。時間をおいてお試しください。', false); btn.disabled = false; })
        .submitFeedback(TOKEN, payload);
    });
  })();
</script>
</body>
</html>
