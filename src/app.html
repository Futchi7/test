<title>禁煙わんこ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one phone-width column; the dog's scene is the hero, numbers below, fixed bottom tab bar + SOS button. */
:root{
  --bg:#EAF2EF;        /* 澄んだ空気のミント */
  --surface:#FFFFFF;
  --soft:#DDEBE6;
  --ink:#16302C;
  --muted:#58706B;
  --line:#CFE0DA;
  --accent:#E07F22;    /* 子犬の毛色に寄せたアンバー */
  --accent-soft:#FBE7D3;
  --teal:#2A8A79;
  --sos:#D8453A;
  --sos-soft:#FBE1DE;
  --f-display:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1A18;--surface:#172624;--soft:#1E322F;--ink:#E4EFEC;--muted:#98B0AB;--line:#28403C;
  --accent:#F29A48;--accent-soft:#3A2A1A;--teal:#5CC4B1;--sos:#F06A5C;--sos-soft:#3B1E1B;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A18;--surface:#172624;--soft:#1E322F;--ink:#E4EFEC;--muted:#98B0AB;--line:#28403C;
  --accent:#F29A48;--accent-soft:#3A2A1A;--teal:#5CC4B1;--sos:#F06A5C;--sos-soft:#3B1E1B;color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:0 calc(150px + env(safe-area-inset-bottom,0px))}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.view{display:flex;flex-direction:column;gap:14px;width:100%}

.top{display:flex;align-items:center;justify-content:space-between;padding-top:14px}
.brand{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.brand-ico{width:32px;height:32px;border-radius:50%;overflow:hidden;position:relative;flex:none;background:var(--accent-soft)}
.brand-ico img{position:absolute;width:76px;max-width:none;left:-7px;top:-6px}
.top .date{font-size:12px;color:var(--muted)}

.banner{background:var(--accent-soft);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:13px}
.banner b{font-family:var(--f-display)}

.card{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:11.5px;letter-spacing:.12em;color:var(--muted);font-weight:700}

/* scene */
.scene-card{background:var(--surface);border-radius:24px;overflow:hidden}
.scene{position:relative;aspect-ratio:1/1;max-width:100%;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.scene svg{display:block;width:100%;height:100%}
.scene.tappable{cursor:pointer}
.scene-meta{padding:12px 16px 16px;display:flex;flex-direction:column;gap:8px}
.scene-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.scene-row h2{font-size:22px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-family:var(--f-display)}
.love{font-family:var(--f-display);color:var(--sos);font-weight:700;font-size:14px}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s}
.bar.teal>i{background:var(--teal)}
.hint{font-size:12.5px;color:var(--muted)}

/* timer */
.timer-card{text-align:center;padding:18px 16px}
.timer{font-family:var(--f-display);font-variant-numeric:tabular-nums;font-weight:800;line-height:1.1;display:flex;justify-content:center;align-items:baseline;gap:8px;flex-wrap:wrap}
.timer .d{font-size:56px;color:var(--accent)}
.timer .u{font-size:18px}
.timer .hms{font-size:26px;color:var(--ink)}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-family:var(--f-display);font-weight:800;font-size:23px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat .v small{font-size:13px;font-weight:700;margin-left:2px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .s{font-size:11.5px;color:var(--muted)}

.row{display:flex;gap:12px;align-items:center}
.row>.grow{flex:1;min-width:0}
.thumb{width:64px;height:64px;border-radius:14px;overflow:hidden;flex:none;background:var(--soft)}
.thumb svg{width:100%;height:100%;display:block}
.thumb.locked svg{filter:grayscale(1) blur(1.5px);opacity:.45}

/* buttons */
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:700;font-family:var(--f-display);background:var(--soft);color:var(--ink)}
.btn.primary{background:var(--accent);color:#fff}
.btn.teal{background:var(--teal);color:#fff}
.btn.danger{background:var(--sos-soft);color:var(--sos)}
.btn.small{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1 1 140px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:20}
.nav-in{display:grid;grid-template-columns:repeat(5,1fr);max-width:520px;width:100%}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:6px 0;font-weight:700;position:relative}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--accent)}
.nav .dot{position:absolute;top:4px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--sos)}
.sos-fab{position:fixed;right:max(16px,calc(50% - 244px));bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:21;border:0;border-radius:99px;background:var(--sos);color:#fff;font-family:var(--f-display);font-weight:800;font-size:15px;padding:13px 20px;box-shadow:0 8px 22px rgba(200,50,40,.35);display:flex;align-items:center;gap:8px}
.sos-fab svg{width:20px;height:20px}

/* lists */
.list{display:flex;flex-direction:column}
.list>li{list-style:none;padding:12px 0;border-top:1px solid var(--line)}
.list>li:first-child{border-top:0}
ul.list{margin:0;padding:0}
.tag{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.got{color:var(--teal);font-weight:700;font-size:12.5px;font-family:var(--f-display)}
.left{color:var(--muted);font-size:12.5px}

.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stage{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:11.5px;min-width:0}
.stage .thumb{width:100%;height:auto;aspect-ratio:1/1}
.stage.future .thumb svg{filter:brightness(0);opacity:.13}
.stage.now .thumb{outline:3px solid var(--accent)}
.stage b{font-family:var(--f-display);font-size:12px}

/* wardrobe */
.slot h3{font-size:15px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.chip{border:2px solid transparent;background:var(--soft);border-radius:14px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:700;min-width:0;text-align:center;line-height:1.3}
.chip .thumb{width:100%;height:auto;aspect-ratio:1/1;background:var(--surface)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chip:disabled{cursor:not-allowed;color:var(--muted)}
.chip .none{display:grid;place-items:center;color:var(--muted);font-size:22px}

/* health */
.hl{display:flex;gap:12px}
.hl .mark{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;background:var(--soft);color:var(--muted);font-family:var(--f-display)}
.hl.done .mark{background:var(--teal);color:#fff}
.hl.cur .mark{background:var(--accent);color:#fff}
.hl .t{font-family:var(--f-display);font-weight:700;font-size:13px;color:var(--muted)}
.hl.done .t{color:var(--teal)}

/* form */
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12.5px;font-weight:700;color:var(--muted)}
.field input,.field textarea{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
.field textarea{min-height:96px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.grid2{grid-template-columns:1fr}}

/* overlays */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,25,22,.5);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.modal{background:var(--surface);border-radius:24px;padding:20px;width:100%;max-width:480px;max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:12px;animation:up .3s ease-out}
.modal h2{font-size:21px}
.modal>*{flex:none}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}

.sos{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sos-in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sos-head{display:flex;justify-content:space-between;align-items:center}
.sos-head h2{font-size:20px;color:var(--sos)}
.card.urge{flex-direction:row;gap:14px;align-items:center}
.urge .ring{width:92px;height:92px;flex:none;position:relative}
.urge .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.urge .ring span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.seg button{flex:none;border:0;border-radius:99px;padding:8px 14px;background:var(--surface);font-weight:700;font-size:13px;font-family:var(--f-display)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.pane{min-height:320px}

.breath{display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px 0}
.bwrap{width:220px;height:220px;max-width:100%;display:grid;place-items:center;position:relative}
.bcircle{width:220px;height:220px;max-width:100%;border-radius:50%;background:radial-gradient(circle at 40% 35%,var(--accent-soft),var(--teal));transform:scale(.5);transition-property:transform;transition-timing-function:ease-in-out}
.bwrap b{position:absolute;font-family:var(--f-display);font-size:34px;color:#fff;font-variant-numeric:tabular-nums}
.btext{font-family:var(--f-display);font-weight:700;font-size:20px}

.field-game{position:relative;height:300px;background:linear-gradient(var(--soft),var(--surface));border-radius:20px;overflow:hidden;touch-action:manipulation}
.ball{position:absolute;width:54px;height:54px;border-radius:50%;border:0;padding:0;background:radial-gradient(circle at 35% 30%,#F4FF9C,#C8DC2C 60%,#9FB31A);box-shadow:0 4px 10px rgba(0,0,0,.18);animation:pop .25s ease-out}
.ball::after{content:"";position:absolute;inset:6px;border-radius:50%;border:3px solid rgba(255,255,255,.85);border-left-color:transparent;border-right-color:transparent;transform:rotate(30deg)}
.ball.caught{animation:catch .25s forwards}
@keyframes pop{from{transform:scale(.2)}to{transform:scale(1)}}
@keyframes catch{to{transform:scale(1.6);opacity:0}}
.game-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center}
.hud{display:flex;justify-content:space-between;font-family:var(--f-display);font-weight:700}

.idea{font-family:var(--f-display);font-size:21px;font-weight:700;line-height:1.45;min-height:3em}
.reasons{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;font-size:16px}

.heart{position:absolute;pointer-events:none;color:var(--sos);font-size:26px;animation:float 1s ease-out forwards;transform:translate(-50%,-50%)}
@keyframes float{to{transform:translate(-50%,-160%) scale(1.4);opacity:0}}

.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;font-size:14px;z-index:60;max-width:calc(100% - 32px);text-align:center;transition:opacity .3s}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70;width:100%;height:100%}

.confirm{background:var(--sos-soft);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.note{font-size:12px;color:var(--muted)}

/* dog animation */
.tail{transform-box:fill-box;transform-origin:0% 100%;animation:wag .5s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-10deg)}to{transform:rotate(16deg)}}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.dog{transform-box:fill-box;transform-origin:50% 100%}
.dog.hop{animation:hop .45s ease-out}
@keyframes hop{40%{transform:translateY(-16px) scale(1.03,.97)}}
.sleeping{animation:breathe 3.2s ease-in-out infinite}
.sleeping .tail{animation:none}
@keyframes breathe{50%{transform:scale(1.02,.975)}}
.zz{animation:zz 2.6s ease-in-out infinite}
@keyframes zz{50%{transform:translateY(-6px);opacity:.5}}
.petal{animation:petal 6s linear infinite}
@keyframes petal{from{transform:translate(0,-40px) rotate(0)}to{transform:translate(-60px,320px) rotate(360deg)}}
.twinkle{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <span class="brand-ico"><img src="assets/dog.webp" alt=""></span>
      禁煙わんこ
    </div>
    <div class="date" id="today"></div>
  </header>
  <div id="banner"></div>
  <main id="view" class="view"></main>
</div>

<button class="sos-fab" id="sosFab" data-act="sos" aria-label="吸いたくなったときのSOS">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 21s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.6-7 10-7 10z"/></svg>
  吸いたい！
</button>

<nav class="nav" aria-label="メニュー"><div class="nav-in" id="nav"></div></nav>
<div id="sos" class="sos" hidden></div>
<div id="overlay" class="overlay" hidden></div>
<div id="toast" class="toast" hidden></div>
<canvas id="confetti" hidden></canvas>

<script>
(function(){
'use strict';
const DAY=86400000, HOUR=3600000, MIN=60000;
const KEY='kinen-wanko-v1';
const MIN_PER_CIG=20; // 1本あたり失う寿命（UCL 2024年研究の推計 約20分）

/* ---------- data ---------- */
const SLOTS={bg:'背景',clothes:'おようふく',head:'あたま',face:'かお',neck:'くび'};
const ITEMS=[
  {id:'bg_room',slot:'bg',name:'おへや',days:0},
  {id:'neck_bandana',slot:'neck',name:'赤いバンダナ',days:1},
  {id:'head_ribbon',slot:'head',name:'きいろのリボン',days:3},
  {id:'bg_park',slot:'bg',name:'ひだまり公園',days:5},
  {id:'cl_border',slot:'clothes',name:'ボーダーTシャツ',days:7},
  {id:'face_sun',slot:'face',name:'サングラス',days:10},
  {id:'bg_beach',slot:'bg',name:'夏の海辺',days:14},
  {id:'neck_bow',slot:'neck',name:'蝶ネクタイ',days:21},
  {id:'cl_knit',slot:'clothes',name:'ニットセーター',days:30},
  {id:'head_beret',slot:'head',name:'ベレー帽',days:45},
  {id:'bg_sakura',slot:'bg',name:'桜並木',days:60},
  {id:'cl_rain',slot:'clothes',name:'レインコート',days:90},
  {id:'head_flower',slot:'head',name:'花かんむり',days:120},
  {id:'face_round',slot:'face',name:'まるメガネ',days:150},
  {id:'bg_night',slot:'bg',name:'星空の丘',days:180},
  {id:'neck_scarf',slot:'neck',name:'チェックのマフラー',days:240},
  {id:'cl_hoodie',slot:'clothes',name:'パーカー',days:300},
  {id:'head_crown',slot:'head',name:'王冠',days:365},
  {id:'bg_space',slot:'bg',name:'宇宙旅行',days:500},
  {id:'cl_cape',slot:'clothes',name:'ヒーローマント',days:730},
  {id:'bg_rainbow',slot:'bg',name:'虹の丘',days:1000},
];
const ITEM=Object.fromEntries(ITEMS.map(i=>[i.id,i]));
const REWARDS=ITEMS.filter(i=>i.days>0);

const STAGES=[
  {d:0,name:'生まれたて',s:.55,hs:1.38,sleep:true,msg:'すやすや眠っています。最初の24時間を見守ってあげて。'},
  {d:1,name:'よちよち',s:.62,hs:1.32,msg:'目をあけました。あなたのことをじっと見ています。'},
  {d:3,name:'子犬',s:.70,hs:1.25,msg:'ニコチンが体から抜けるころ。いちばんの山場を一緒に越えよう。'},
  {d:7,name:'やんちゃ盛り',s:.78,hs:1.18,msg:'1週間！ しっぽが止まりません。'},
  {d:30,name:'若犬',s:.88,hs:1.10,msg:'1か月。習慣が変わり始めています。'},
  {d:90,name:'成犬',s:.96,hs:1.03,msg:'3か月。すっかり頼もしくなりました。'},
  {d:180,name:'頼れる相棒',s:1.02,hs:1.00,msg:'半年。もう立派な相棒です。'},
  {d:365,name:'最高の親友',s:1.08,hs:1.00,glow:true,msg:'1年。あなたとこの子の記念日です。'},
];

const HEALTH=[
  {ms:20*MIN,t:'20分',title:'血圧と脈拍が正常に近づく'},
  {ms:8*HOUR,t:'8時間',title:'血中の一酸化炭素が減り、酸素が体に行き渡る'},
  {ms:DAY,t:'24時間',title:'心臓発作のリスクが下がり始める'},
  {ms:2*DAY,t:'48時間',title:'においと味がわかりやすくなる'},
  {ms:3*DAY,t:'72時間',title:'気管支がゆるみ、呼吸が楽になる'},
  {ms:14*DAY,t:'2週間',title:'血液の流れと肺の機能が良くなり始める'},
  {ms:90*DAY,t:'3か月',title:'せきや息切れが減ってくる'},
  {ms:365*DAY,t:'1年',title:'心臓病のリスクが喫煙者の約半分に'},
  {ms:5*365*DAY,t:'5年',title:'脳卒中のリスクが非喫煙者に近づく'},
  {ms:10*365*DAY,t:'10年',title:'肺がんで亡くなるリスクが喫煙者の約半分に'},
  {ms:15*365*DAY,t:'15年',title:'心臓病のリスクが非喫煙者と同じ水準に'},
];

const IDEAS=[
  '冷たい水をコップ1杯、ゆっくり飲む',
  '歯みがきをする。口がさっぱりすると吸いたさが下がります',
  'その場を離れて、5分だけ歩く',
  'ガムを噛むか、氷をひとつ口に含む',
  '手を洗って、ハンドクリームを塗る',
  '好きな曲を1曲だけ聴く',
  '誰かに「いま禁煙がんばってる」と送る',
  '肩をぐるっと10回まわして、背伸びする',
  '窓を開けて、外の空気を吸う',
  'スクワットを10回だけやってみる',
  '浮いたお金で買いたいものを検索する',
  'シャワーで顔を洗う',
];

/* ---------- state ---------- */
function defaults(){
  const now=Date.now();
  return {v:1,sample:true,quitAt:now-12*DAY-4.5*HOUR,perDay:20,packPrice:600,perPack:20,

function streakMs(){return Math.max(0,Date.now()-S.quitAt)}
function totalMs(){return S.pastMs+streakMs()}
function totalDays(){return totalMs()/DAY}
function perCig(){return S.perPack>0?S.packPrice/S.perPack:0}
function cigsAvoided(){return Math.floor(totalMs()/DAY*S.perDay)}
function saved(){return Math.floor(cigsAvoided()*perCig())}

function fmtDur(ms){

/* ---------- pet ---------- */
function pet(scene,e,prefix){
  const r=scene.getBoundingClientRect();
  const h=document.createElement('span');h.className='heart';h.textContent='♥';
  h.style.left=((e.clientX||r.left+r.width/2)-r.left)+'px';h.style.top=((e.clientY||r.top+r.height/2)-r.top)+'px';
  scene.appendChild(h);setTimeout(()=>h.remove(),1000);
  const dog=document.getElementById(prefix+'dog');
  if(dog){dog.classList.remove('hop');void dog.getBoundingClientRect();dog.classList.add('hop');}
  S.pets++;save();
  const lc=$('loveCount');if(lc)lc.textContent='♥ '+S.pets;
  const pc=$('petCount');if(pc)pc.textContent=S.pets;
}

/* ---------- toast / modal / confetti ---------- */
let toastT;
function toast(msg){const t=$('toast');t.textContent=msg;t.hidden=false;t.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>{t.style.opacity=0;setTimeout(()=>t.hidden=true,300)},2600)}
function openModal(html){const o=$('overlay');o.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${html}</div>`;o.hidden=false}
function closeModal(){$('overlay').hidden=true;$('overlay').innerHTML=''}
function confetti(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=$('confetti');c.hidden=false;const W=c.width=innerWidth,H=c.height=innerHeight,x=c.getContext('2d');
  const cols=['#E07F22','#2A8A79','#F2C230','#E0457B','#7CC4F2'];
  const ps=Array.from({length:120},()=>({x:W/2,y:H*.4,vx:(Math.random()-.5)*12,vy:-Math.random()*12-4,r:Math.random()*6+3,c:cols[Math.random()*5|0],a:Math.random()*6}));
  const t0=performance.now();
  (function f(t){x.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});
    if(t-t0<2600)requestAnimationFrame(f);else{x.clearRect(0,0,W,H);c.hidden=true}})(t0);
}

/* ---------- unlocks ---------- */
let lastStage=stageIdx(),lastDay=Math.floor(totalDays());
function checkUnlocks(){
  if(S.sample)return;
  const fresh=REWARDS.filter(i=>totalMs()>=i.days*DAY&&!S.unlocked.includes(i.id));
  const si=stageIdx(),grew=si>lastStage;lastStage=si;
  if(!fresh.length&&!grew)return;
  S.unlocked.push(...fresh.map(i=>i.id));save();
  if(!$('overlay').hidden||!$('sos').hidden){if(S.tab!=='settings')render();return}
  const st=STAGES[si];
  openModal(`<div class="scene" style="border-radius:18px;overflow:hidden">${sceneSVG('m',fresh.length?Object.assign({},S.equipped,{[fresh[fresh.length-1].slot]:fresh[fresh.length-1].id}):S.equipped)}</div>
    <h2>${grew?`${esc(S.dogName)}が「${st.name}」に成長しました！`:'ごほうびが届きました！'}</h2>
    ${fresh.length>1?`<p class="hint">${fresh.length}個のごほうびを受け取りました。</p>`:''}
    <div class="btns">${fresh.length?`<button class="btn primary" data-wear="${fresh[fresh.length-1].id}">着せてみる</button>`:''}<button class="btn" data-act="close">とじる</button></div>
    ${fresh.length?`<ul class="list">${fresh.map(i=>`<li class="row"><div class="thumb">${thumbSVG(i,'mf'+i.id)}</div><div class="grow"><span class="tag">${i.days}日目・${SLOTS[i.slot]}</span><div><b>${i.name}</b></div></div></li>`).join('')}</ul>`:`<p class="hint">${st.msg}</p>`}`);
  confetti();if(S.tab!=='settings')render();
}

/* ---------- SOS ---------- */
let sosTimers=[],sosGen=0,urgeEnd=0,urgeTimer=null;
function clearPane(){sosTimers.forEach(t=>{clearTimeout(t);clearInterval(t)});sosTimers=[];sosGen++}
const PANES=[['breath','深呼吸'],['ball','ボール遊び'],['pet','なでなで'],['idea','やること'],['why','理由']];
function openSOS(){
  urgeEnd=Date.now()+180000;
  $('sos').innerHTML=`<div class="sos-in">
    <div class="sos-head"><h2>吸いたくなったね。大丈夫。</h2><button class="btn small" data-act="sosClose">閉じる</button></div>
    <div class="card urge"><div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="var(--soft)" stroke-width="10"/><circle id="urgeArc" cx="50" cy="50" r="44" fill="none" stroke="var(--sos)" stroke-width="10" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="0"/></svg><span id="urgeTxt">3:00</span></div>
      <div class="grow" style="min-width:0"><b id="urgeHead">波が引くまで、あと少し</b><div class="hint">吸いたい気持ちのピークは、たいてい3〜5分で過ぎていきます。下のどれかをしながら待ちましょう。</div></div></div>
    <div class="seg" role="group" aria-label="気を紛らわせる方法">${PANES.map(([id,l],i)=>`<button data-pane="${id}" aria-pressed="${i===0}">${l}</button>`).join('')}</div>
    <div class="card pane" id="pane"></div>
    <div class="card"><div class="hint">いま1本吸うと <b class="num">${yen(perCig())}</b> と、寿命 約<b>${MIN_PER_CIG}分</b>。そして ${esc(S.dogName)} との ${Math.floor(totalDays())}日間。</div></div>
    <div class="btns"><button class="btn teal" data-act="win">乗り越えた！</button><button class="btn danger" data-act="slip">吸ってしまった</button></div>
  </div>`;
  $('sos').hidden=false;document.body.style.overflow='hidden';
  showPane('breath');
  clearInterval(urgeTimer);urgeTimer=setInterval(tickUrge,250);tickUrge();
}
function tickUrge(){
  const left=Math.max(0,urgeEnd-Date.now());const a=$('urgeArc');if(!a)return;
  a.setAttribute('stroke-dashoffset',(276.5*(1-left/180000)).toFixed(1));
  const sec=Math.ceil(left/1000);$('urgeTxt').textContent=`${Math.floor(sec/60)}:${pad(sec%60)}`;
  if(left<=0){$('urgeTxt').textContent='✓';$('urgeHead').textContent='3分たちました。波は越えられそうですか？';a.setAttribute('stroke','var(--teal)');clearInterval(urgeTimer)}
}
function closeSOS(){clearPane();clearInterval(urgeTimer);$('sos').hidden=true;$('sos').innerHTML='';document.body.style.overflow=''}
function showPane(id){
  clearPane();
  document.querySelectorAll('[data-pane]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.pane===id));
  const P=$('pane');
  if(id==='breath'){
    P.innerHTML=`<div class="breath"><div class="bwrap"><div class="bcircle" id="bc"></div><b id="bNum"></b></div><div class="btext" id="bTxt">準備して…</div><div class="hint" id="bCyc">4秒吸って、4秒止めて、6秒かけて吐きます</div></div>`;
    const ph=[['鼻からゆっくり吸って',4,1],['そのまま止めて',4,1],['口から細く吐いて',6,.5]];const g=sosGen;let k=0,cyc=0;
    const step=()=>{if(g!==sosGen)return;const [t,d,sc]=ph[k];const bc=$('bc');bc.style.transitionDuration=d+'s';bc.style.transform=`scale(${sc})`;$('bTxt').textContent=t;
      let n=d;$('bNum').textContent=n;const iv=setInterval(()=>{n--;if(n>0&&$('bNum'))$('bNum').textContent=n},1000);sosTimers.push(iv);
      sosTimers.push(setTimeout(()=>{clearInterval(iv);k=(k+1)%3;if(k===0){cyc++;$('bCyc').textContent=cyc+'セット完了'}step()},d*1000))};
    sosTimers.push(setTimeout(step,600));
  }else if(id==='ball'){
    P.innerHTML=`<div class="hud"><span>キャッチ <span id="gS">0</span></span><span>のこり <span id="gT">30</span>秒</span></div><div class="field-game" id="fg"><div class="game-center"><b>${esc(S.dogName)}とボール遊び</b><span class="hint">出てくるボールを、消える前にタップ！</span><button class="btn primary" data-act="gameStart">スタート</button></div></div>`;
  }else if(id==='pet'){
    P.innerHTML=`<div class="scene tappable" data-pet="s" style="border-radius:16px;overflow:hidden">${sceneSVG('s')}</div><div class="scene-row"><span class="hint">タップしてなでてあげよう</span><span class="love">♥ <span id="petCount">${S.pets}</span></span></div>`;
  }else if(id==='idea'){
    P.innerHTML=`<div class="eyebrow">いまできること</div><div class="idea" id="ideaTxt">${IDEAS[Math.random()*IDEAS.length|0]}</div><div class="btns"><button class="btn" data-act="idea">ほかの案</button><button class="btn primary" data-act="ideaDo">やってみる</button></div>`;
  }else if(id==='why'){
    const goal=S.goalName?`<div class="card" style="background:var(--soft)"><div class="eyebrow">浮いたお金で</div><b>${esc(S.goalName)}</b><div class="hint">いま ${yen(saved())} / ${yen(S.goalPrice)}</div></div>`:'';
    P.innerHTML=`<div class="eyebrow">あなたが禁煙を決めた理由</div>${S.reasons.length?`<ol class="reasons">${S.reasons.map(r=>`<li>${esc(r)}</li>`).join('')}</ol>`:'<div class="hint">設定から理由を書いておくと、ここに表示されます。</div>'}${goal}`;
  }
}
function startGame(){
  clearPane();const g=sosGen,fg=$('fg');let score=0,left=30;fg.innerHTML='';
  $('gS').textContent=0;$('gT').textContent=30;
  const spawn=()=>{if(g!==sosGen)return;const b=document.createElement('button');b.className='ball';b.setAttribute('aria-label','ボール');
    b.style.left=(Math.random()*80+2)+'%';b.style.top=(Math.random()*76+2)+'%';
    b.addEventListener('pointerdown',ev=>{ev.preventDefault();if(b.classList.contains('caught'))return;b.classList.add('caught');score++;$('gS').textContent=score;setTimeout(()=>b.remove(),250)});
    fg.appendChild(b);sosTimers.push(setTimeout(()=>{if(!b.classList.contains('caught'))b.remove()},Math.max(700,1300-(30-left)*15)))};
  sosTimers.push(setInterval(spawn,600));
  sosTimers.push(setInterval(()=>{left--;if($('gT'))$('gT').textContent=left;if(left<=0){clearPane();fg.innerHTML=`<div class="game-center"><b style="font-size:22px">${score}個キャッチ！</b><span class="hint">${esc(S.dogName)}は大満足。30秒、吸わずに過ごせました。</span><button class="btn primary" data-act="gameStart">もう一回</button></div>`}},1000));
  spawn();
}

/* ---------- slip ---------- */
function openSlip(){
  openModal(`<h2>記録して、また続けよう</h2>
  <p class="hint">1本吸っても、それまでの日々が無駄になるわけではありません。「失敗した」と考えるほど、次の1本につながりやすくなります。どうするか選んでください。</p>
  <p class="note">どちらを選んでも、${esc(S.dogName)}の成長と手に入れたごほうびはそのまま残ります。</p>
  <div class="btns" style="flex-direction:column"><button class="btn teal" data-act="slipLog">記録だけして、カウントは続ける</button><button class="btn danger" data-act="slipReset">いまから再スタートする</button><button class="btn" data-act="close">キャンセル</button></div>`);
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-act],[data-equip],[data-wear],[data-pane]');if(!t)return;
  if(t.dataset.tab){S.tab=t.dataset.tab;save();render();scrollTo(0,0);return}
  if(t.dataset.pane){showPane(t.dataset.pane);return}
  if(t.dataset.equip){const [slot,id]=t.dataset.equip.split(':');S.equipped[slot]=id||null;save();render();return}
  if(t.dataset.wear){const i=ITEM[t.dataset.wear];S.equipped[i.slot]=i.id;save();closeModal();S.tab='dress';render();scrollTo(0,0);toast(i.name+'を着せました');return}
  switch(t.dataset.act){
    case 'sos':openSOS();break;
    case 'sosClose':closeSOS();break;
    case 'close':closeModal();break;
    case 'win':S.wins++;save();closeSOS();render();confetti();toast(`やったね！ ${S.dogName}がしっぽを振っています`);break;
    case 'slip':closeSOS();openSlip();break;
    case 'slipLog':S.slips.push({at:Date.now(),reset:false});save();closeModal();render();toast('記録しました。ここからまた一緒に。');break;
    case 'slipReset':{const now=Date.now();S.pastMs+=now-S.quitAt;S.quitAt=now;S.slips.push({at:now,reset:true});save();closeModal();render();toast('再スタート。成長とごほうびはそのままです。');break;}
    case 'gameStart':startGame();break;
    case 'idea':{let n;do{n=IDEAS[Math.random()*IDEAS.length|0]}while(n===$('ideaTxt').textContent&&IDEAS.length>1);$('ideaTxt').textContent=n;break;}
    case 'ideaDo':toast('いいね。終わったら「乗り越えた！」を押そう');break;
    case 'resetAsk':$('resetBox').innerHTML=`<div class="confirm"><b>本当にすべて消しますか？</b><span>禁煙の記録、ごほうび、きせかえが消えて、サンプル表示に戻ります。元に戻せません。</span><div class="btns"><button class="btn danger" data-act="resetDo">消す</button><button class="btn" data-act="resetNo">やめる</button></div></div>`;break;
    case 'resetNo':render();break;
    case 'resetDo':try{localStorage.removeItem(KEY)}catch(_){ }S=defaults();S.unlocked=REWARDS.filter(i=>totalMs()>=i.days*DAY).map(i=>i.id);lastStage=stageIdx();render();toast('記録を消しました');break;
  }
});
document.addEventListener('pointerdown',e=>{
  const sc=e.target.closest('[data-pet]');if(!sc)return;
  if(e.target.closest('.ball'))return;
  pet(sc,e,sc.dataset.pet);
});
$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('overlay').hidden)closeModal();else if(!$('sos').hidden)closeSOS()}});

document.addEventListener('submit',e=>{
  if(e.target.id!=='setForm')return;e.preventDefault();
  const v=id=>$(id).value.trim();
  const q=new Date(v('fQuit')).getTime(),per=+v('fPer'),price=+v('fPrice'),pack=+v('fPack'),gp=+(v('fGoalP')||0);
  const err=[];
  if(!v('fName'))err.push('わんこの名前を入れてください。');
  if(!isFinite(q))err.push('禁煙を始めた日時を入れてください。');
  else if(q>Date.now()+60000)err.push('禁煙を始めた日時は、いまより前の日時にしてください。');
  if(!(per>0))err.push('1日の本数は1以上の数字にしてください。');
  if(!(price>0)||!(pack>0))err.push('1箱の値段と本数は1以上の数字にしてください。');
  if(err.length){$('formErr').textContent=err.join(' ');return}
  const first=S.sample;
  if(first){S.sample=false;S.unlocked=[];S.seenCount=0;S.pastMs=0;S.wins=0;S.pets=0;S.slips=[];S.equipped={bg:'bg_room',clothes:null,head:null,face:null,neck:null};}
  else if(q!==S.quitAt){S.pastMs=0}
  Object.assign(S,{dogName:v('fName'),quitAt:q,perDay:per,packPrice:price,perPack:pack,goalName:v('fGoal'),goalPrice:gp,reasons:$('fReasons').value.split('\n').map(s=>s.trim()).filter(Boolean)});
  lastStage=first?0:stageIdx();
  S.tab='home';save();render();scrollTo(0,0);
  toast(first?`${S.dogName}との禁煙がはじまりました`:'保存しました');
  checkUnlocks();
});

/* ---------- loop ---------- */
render();
setInterval(()=>{
  if(S.tab==='home'&&$('overlay').hidden)tickHome();
  const d=Math.floor(totalDays());
  if(d!==lastDay){lastDay=d;if(S.tab!=='dress'&&S.tab!=='settings'&&$('overlay').hidden)render()}
  checkUnlocks();
},1000);
})();
</script>
